apiVersion: v1
kind: ServiceAccount
metadata:
  name: notebook-qualification
  namespace: aira-notebook-qualification
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: notebook-qualification
rules:
  - apiGroups: ['']
    resources: ['namespaces']
    verbs: ['get', 'watch', 'create', 'delete']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch', 'create', 'delete']
  - apiGroups: ['']
    resources: ['pods/log']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods/exec']
    verbs: ['create']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies']
    verbs: ['get', 'list', 'create']
  - apiGroups: ['node.k8s.io']
    resources: ['runtimeclasses']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notebook-qualification
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: notebook-qualification
subjects:
  - kind: ServiceAccount
    name: notebook-qualification
    namespace: aira-notebook-qualification
